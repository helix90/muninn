<div class="bg-white rounded-lg shadow-md p-6">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">RSS Reader Configuration</h2>
    
    <div class="space-y-6">
        <!-- Feed URL -->
        <div>
            <label for="feed_url" class="block text-sm font-medium text-gray-700 mb-2">RSS Feed URL *</label>
            <input type="url" id="feed_url" name="feed_url" required
                   value="{{ form_data.feed_url if form_data else '' }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="https://example.com/feed.xml">
            <p class="mt-1 text-sm text-gray-500">The URL of the RSS/Atom feed to read</p>
        </div>
        
        <!-- Feed Options -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="max_entries" class="block text-sm font-medium text-gray-700 mb-2">Max Entries</label>
                <input type="number" id="max_entries" name="max_entries" min="1" max="1000"
                       value="{{ form_data.max_entries if form_data else 50 }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <p class="mt-1 text-sm text-gray-500">Maximum number of entries to process</p>
            </div>
            
            <div>
                <label for="timeout" class="block text-sm font-medium text-gray-700 mb-2">Timeout (seconds)</label>
                <input type="number" id="timeout" name="timeout" min="1" max="300"
                       value="{{ form_data.timeout if form_data else 30 }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <p class="mt-1 text-sm text-gray-500">Request timeout in seconds</p>
            </div>
        </div>
        
        <!-- Content Filtering -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Content Filtering</label>
            <div class="space-y-3">
                <div>
                    <label for="title_filter" class="block text-sm text-gray-600 mb-1">Title Filter (regex)</label>
                    <input type="text" id="title_filter" name="title_filter"
                           value="{{ form_data.title_filter if form_data else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder=".*python.*">
                    <p class="mt-1 text-xs text-gray-500">Only include entries with titles matching this regex</p>
                </div>
                <div>
                    <label for="content_filter" class="block text-sm text-gray-600 mb-1">Content Filter (regex)</label>
                    <input type="text" id="content_filter" name="content_filter"
                           value="{{ form_data.content_filter if form_data else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder=".*tutorial.*">
                    <p class="mt-1 text-xs text-gray-500">Only include entries with content matching this regex</p>
                </div>
            </div>
        </div>
        
        <!-- Output Options -->
        <div class="flex space-x-6">
            <label class="flex items-center">
                <input type="checkbox" name="include_content" checked
                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                <span class="ml-2 text-sm text-gray-700">Include full content</span>
            </label>
            <label class="flex items-center">
                <input type="checkbox" name="include_summary"
                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                <span class="ml-2 text-sm text-gray-700">Include summary</span>
            </label>
        </div>
    </div>
</div>
