version: '3.8'

services:
  muninn:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - SECRET_KEY=dev-secret-key
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql://muninn_user:muninn_pass@postgres:5432/muninn_dev
      - TEST_DATABASE_URL=postgresql://muninn_user:muninn_pass@postgres:5432/muninn_test
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: muninn_dev
      POSTGRES_USER: muninn_user
      POSTGRES_PASSWORD: muninn_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muninn_user -d muninn_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis service for future use (caching, sessions, etc.)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data: 