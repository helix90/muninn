<div class="bg-white rounded-lg shadow-md p-6">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Web Scraper Configuration</h2>
    
    <div class="space-y-6">
        <!-- Target URL -->
        <div>
            <label for="url" class="block text-sm font-medium text-gray-700 mb-2">Target URL *</label>
            <input type="url" id="url" name="url" required
                   value="{{ form_data.url if form_data else '' }}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="https://example.com">
            <p class="mt-1 text-sm text-gray-500">The URL of the webpage to scrape</p>
        </div>
        
        <!-- CSS Selectors -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">CSS Selectors *</label>
            <p class="text-sm text-gray-500 mb-3">Define what data to extract from the page</p>
            <div id="selectorsContainer" class="space-y-3">
                <div class="flex space-x-3">
                    <input type="text" name="selector_name" placeholder="Data name (e.g., title)"
                           class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <input type="text" name="selector_value" placeholder="CSS selector (e.g., h1)"
                           class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
            </div>
            <button type="button" onclick="addSelector()" 
                    class="mt-2 text-sm text-blue-600 hover:text-blue-800">+ Add Selector</button>
        </div>
        
        <!-- Advanced Options -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="timeout" class="block text-sm font-medium text-gray-700 mb-2">Timeout (seconds)</label>
                <input type="number" id="timeout" name="timeout" min="1" max="300"
                       value="{{ form_data.timeout if form_data else 30 }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <p class="mt-1 text-sm text-gray-500">Request timeout in seconds</p>
            </div>
            
            <div>
                <label for="user_agent" class="block text-sm font-medium text-gray-700 mb-2">User Agent</label>
                <input type="text" id="user_agent" name="user_agent"
                       value="{{ form_data.user_agent if form_data else '' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="Custom user agent string">
                <p class="mt-1 text-sm text-gray-500">Custom user agent (optional)</p>
            </div>
        </div>
        
        <!-- Extraction Options -->
        <div class="flex space-x-6">
            <label class="flex items-center">
                <input type="checkbox" name="extract_text" checked
                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                <span class="ml-2 text-sm text-gray-700">Extract text content</span>
            </label>
            <label class="flex items-center">
                <input type="checkbox" name="extract_links"
                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                <span class="ml-2 text-sm text-gray-700">Extract links</span>
            </label>
        </div>
    </div>
</div>

<script>
function addSelector() {
    const container = document.getElementById('selectorsContainer');
    const newSelector = document.createElement('div');
    newSelector.className = 'flex space-x-3';
    newSelector.innerHTML = `
        <input type="text" name="selector_name" placeholder="Data name (e.g., title)"
               class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        <input type="text" name="selector_value" placeholder="CSS selector (e.g., h1)"
               class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        <button type="button" onclick="this.parentElement.remove()" 
                class="px-3 py-2 text-red-600 hover:text-red-800">×</button>
    `;
    container.appendChild(newSelector);
}
</script>
