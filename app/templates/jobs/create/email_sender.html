<div class="bg-white rounded-lg shadow-md p-6">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Email Sender Configuration</h2>
    
    <div class="space-y-6">
        <!-- SMTP Configuration -->
        <div class="bg-gray-50 rounded-lg p-4">
            <h3 class="text-lg font-medium text-gray-800 mb-3">SMTP Server Settings</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="smtp_server" class="block text-sm font-medium text-gray-700 mb-2">SMTP Server *</label>
                    <input type="text" id="smtp_server" name="smtp_server" required
                           value="{{ form_data.smtp_server if form_data else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="smtp.gmail.com">
                </div>
                <div>
                    <label for="smtp_port" class="block text-sm font-medium text-gray-700 mb-2">Port *</label>
                    <input type="number" id="smtp_port" name="smtp_port" required min="1" max="65535"
                           value="{{ form_data.smtp_port if form_data else 587 }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="587">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username *</label>
                    <input type="text" id="username" name="username" required
                           value="{{ form_data.username if form_data else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="your-email@example.com">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password *</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Your email password or app password">
                </div>
            </div>
            
            <div class="mt-4">
                <label class="flex items-center">
                    <input type="checkbox" name="use_tls" checked
                           class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700">Use TLS encryption</span>
                </label>
            </div>
        </div>
        
        <!-- Email Content -->
        <div>
            <h3 class="text-lg font-medium text-gray-800 mb-3">Email Content</h3>
            <div class="space-y-4">
                <div>
                    <label for="to_emails" class="block text-sm font-medium text-gray-700 mb-2">Recipients *</label>
                    <textarea id="to_emails" name="to_emails" required rows="2"
                              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                              placeholder="recipient1@example.com, recipient2@example.com">{{ form_data.to_emails if form_data else '' }}</textarea>
                    <p class="mt-1 text-sm text-gray-500">Comma-separated list of email addresses</p>
                </div>
                
                <div>
                    <label for="subject" class="block text-sm font-medium text-gray-700 mb-2">Subject *</label>
                    <input type="text" id="subject" name="subject" required
                           value="{{ form_data.subject if form_data else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Email subject line">
                </div>
                
                <div>
                    <label for="body_template" class="block text-sm font-medium text-gray-700 mb-2">Email Body Template</label>
                    <textarea id="body_template" name="body_template" rows="6"
                              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                              placeholder="Hello,

Here are the latest results from your job:

{{data}}

Best regards,
Your Automation System">{{ form_data.body_template if form_data else '' }}</textarea>
                    <p class="mt-1 text-sm text-gray-500">Use {{data}} to insert job results. HTML is supported.</p>
                </div>
            </div>
        </div>
        
        <!-- Data Source -->
        <div>
            <label for="data_source" class="block text-sm font-medium text-gray-700 mb-2">Data Source</label>
            <select id="data_source" name="data_source"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">Select data source</option>
                <option value="web_scraper" {% if form_data and form_data.data_source == 'web_scraper' %}selected{% endif %}>Web Scraper Job</option>
                <option value="rss_reader" {% if form_data and form_data.data_source == 'rss_reader' %}selected{% endif %}>RSS Reader Job</option>
                <option value="filter" {% if form_data and form_data.data_source == 'filter' %}selected{% endif %}>Filter Job</option>
                <option value="manual" {% if form_data and form_data.data_source == 'manual' %}selected{% endif %}>Manual Data</option>
            </select>
            <p class="mt-1 text-sm text-gray-500">Choose where the email content data comes from</p>
        </div>
        
        <!-- Manual Data (if selected) -->
        <div id="manual_data" class="hidden">
            <label for="manual_data_content" class="block text-sm font-medium text-gray-700 mb-2">Manual Data Content</label>
            <textarea id="manual_data_content" name="manual_data_content" rows="4"
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                      placeholder="Enter the data to include in the email..."></textarea>
        </div>
        
        <!-- Job Selection (if job source selected) -->
        <div id="job_data_source" class="hidden">
            <label for="source_job_id" class="block text-sm font-medium text-gray-700 mb-2">Source Job</label>
            <select id="source_job_id" name="source_job_id"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">Select a job</option>
                <!-- This will be populated dynamically -->
            </select>
        </div>
        
        <!-- Email Options -->
        <div class="flex space-x-6">
            <label class="flex items-center">
                <input type="checkbox" name="send_as_html"
                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                <span class="ml-2 text-sm text-gray-700">Send as HTML email</span>
            </label>
            <label class="flex items-center">
                <input type="checkbox" name="include_attachments"
                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                <span class="ml-2 text-sm text-gray-700">Include data as attachment</span>
            </label>
        </div>
    </div>
</div>

<script>
// Show/hide data source sections
document.addEventListener('DOMContentLoaded', function() {
    const dataSource = document.getElementById('data_source');
    const manualData = document.getElementById('manual_data');
    const jobDataSource = document.getElementById('job_data_source');
    
    function toggleDataSourceSections() {
        if (dataSource.value === 'manual') {
            manualData.classList.remove('hidden');
            jobDataSource.classList.add('hidden');
        } else if (dataSource.value === 'web_scraper' || dataSource.value === 'rss_reader' || dataSource.value === 'filter') {
            manualData.classList.add('hidden');
            jobDataSource.classList.remove('hidden');
        } else {
            manualData.classList.add('hidden');
            jobDataSource.classList.add('hidden');
        }
    }
    
    dataSource.addEventListener('change', toggleDataSourceSections);
    toggleDataSourceSections(); // Initial call
});
</script>
