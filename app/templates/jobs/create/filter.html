<div class="bg-white rounded-lg shadow-md p-6">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Data Filter Configuration</h2>
    
    <div class="space-y-6">
        <!-- Input Data Source -->
        <div>
            <label for="input_source" class="block text-sm font-medium text-gray-700 mb-2">Input Data Source *</label>
            <select id="input_source" name="input_source" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">Select input source</option>
                <option value="web_scraper" {% if form_data and form_data.input_source == 'web_scraper' %}selected{% endif %}>Web Scraper Job</option>
                <option value="rss_reader" {% if form_data and form_data.input_source == 'rss_reader' %}selected{% endif %}>RSS Reader Job</option>
                <option value="manual" {% if form_data and form_data.input_source == 'manual' %}selected{% endif %}>Manual Input</option>
            </select>
            <p class="mt-1 text-sm text-gray-500">Choose where the data to filter comes from</p>
        </div>
        
        <!-- Manual Input (if selected) -->
        <div id="manual_input" class="hidden">
            <label for="input_data" class="block text-sm font-medium text-gray-700 mb-2">Input Data (JSON)</label>
            <textarea id="input_data" name="input_data" rows="6"
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                      placeholder='{"items": [{"title": "Example", "content": "Sample content"}]}'></textarea>
            <p class="mt-1 text-sm text-gray-500">JSON data to filter (only used if Manual Input is selected)</p>
        </div>
        
        <!-- Job Selection (if job source selected) -->
        <div id="job_selection" class="hidden">
            <label for="source_job_id" class="block text-sm font-medium text-gray-700 mb-2">Source Job</label>
            <select id="source_job_id" name="source_job_id"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">Select a job</option>
                <!-- This will be populated dynamically -->
            </select>
            <p class="mt-1 text-sm text-gray-500">Choose the job to get data from</p>
        </div>
        
        <!-- Filter Rules -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Filter Rules *</label>
            <p class="text-sm text-gray-500 mb-3">Define the filtering criteria</p>
            <div id="filtersContainer" class="space-y-4">
                <div class="border border-gray-200 rounded-lg p-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Field</label>
                            <input type="text" name="filter_field" placeholder="title"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Operator</label>
                            <select name="filter_operator"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="contains">Contains</option>
                                <option value="equals">Equals</option>
                                <option value="regex">Regex Match</option>
                                <option value="not_contains">Does Not Contain</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Value</label>
                            <input type="text" name="filter_value" placeholder="python"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                    </div>
                </div>
            </div>
            <button type="button" onclick="addFilter()" 
                    class="mt-2 text-sm text-blue-600 hover:text-blue-800">+ Add Filter Rule</button>
        </div>
        
        <!-- Output Options -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="output_format" class="block text-sm font-medium text-gray-700 mb-2">Output Format</label>
                <select id="output_format" name="output_format"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="json" {% if form_data and form_data.output_format == 'json' %}selected{% endif %}>JSON</option>
                    <option value="csv" {% if form_data and form_data.output_format == 'csv' %}selected{% endif %}>CSV</option>
                    <option value="text" {% if form_data and form_data.output_format == 'text' %}selected{% endif %}>Plain Text</option>
                </select>
            </div>
            
            <div>
                <label for="max_results" class="block text-sm font-medium text-gray-700 mb-2">Max Results</label>
                <input type="number" id="max_results" name="max_results" min="1" max="10000"
                       value="{{ form_data.max_results if form_data else 100 }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
        </div>
    </div>
</div>

<script>
function addFilter() {
    const container = document.getElementById('filtersContainer');
    const newFilter = document.createElement('div');
    newFilter.className = 'border border-gray-200 rounded-lg p-4';
    newFilter.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Field</label>
                <input type="text" name="filter_field" placeholder="title"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Operator</label>
                <select name="filter_operator"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="contains">Contains</option>
                    <option value="equals">Equals</option>
                    <option value="regex">Regex Match</option>
                    <option value="not_contains">Does Not Contain</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Value</label>
                <input type="text" name="filter_value" placeholder="python"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
        </div>
        <button type="button" onclick="this.parentElement.remove()" 
                class="mt-2 text-sm text-red-600 hover:text-red-800">Remove Filter</button>
    `;
    container.appendChild(newFilter);
}

// Show/hide input sections based on source selection
document.addEventListener('DOMContentLoaded', function() {
    const inputSource = document.getElementById('input_source');
    const manualInput = document.getElementById('manual_input');
    const jobSelection = document.getElementById('job_selection');
    
    function toggleInputSections() {
        if (inputSource.value === 'manual') {
            manualInput.classList.remove('hidden');
            jobSelection.classList.add('hidden');
        } else if (inputSource.value === 'web_scraper' || inputSource.value === 'rss_reader') {
            manualInput.classList.add('hidden');
            jobSelection.classList.remove('hidden');
        } else {
            manualInput.classList.add('hidden');
            jobSelection.classList.add('hidden');
        }
    }
    
    inputSource.addEventListener('change', toggleInputSections);
    toggleInputSections(); // Initial call
});
</script>
