{% extends "base.html" %}

{% block title %}Create Job{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-12">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-white shadow rounded-lg">
            <div class="px-6 py-4 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-gray-900">Create New Job</h1>
                <p class="mt-1 text-sm text-gray-600">Configure and create a new automation job</p>
            </div>
            
            <form method="POST" action="{{ url_for('jobs.create_job') }}" class="p-6">
                
                <!-- Job Type Selection -->
                <div class="mb-8">
                    <label for="job_type" class="block text-sm font-medium text-gray-700 mb-2">
                        Job Type *
                    </label>
                    <select id="job_type" name="job_type" required
                            onchange="loadJobTypeTemplate()"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Select a job type</option>
                        {% for job_type in job_types %}
                        <option value="{{ job_type.type }}" 
                                {% if form_data and form_data.job_type == job_type.type %}selected{% endif %}>
                            {{ job_type.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Job Name -->
                <div class="mb-8">
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                        Job Name *
                    </label>
                    <input type="text" id="name" name="name" required
                           value="{{ form_data.name if form_data else '' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Enter a descriptive name for this job">
                </div>

                <!-- Dynamic Job Type Configuration -->
                <div id="jobConfig" class="mb-8">
                    <div class="bg-gray-50 rounded-lg p-6 text-center">
                        <p class="text-gray-500">Select a job type to configure</p>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="flex justify-end space-x-4">
                    <a href="{{ url_for('jobs.job_list') }}" 
                       class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">
                        Cancel
                    </a>
                    <button type="submit" 
                            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded">
                        Create Job
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function loadJobTypeTemplate() {
    const jobTypeSelect = document.getElementById('job_type');
    const jobConfig = document.getElementById('jobConfig');
    
    if (jobTypeSelect.value) {
        // Load the appropriate template via AJAX
        fetch(`/jobs/create/${jobTypeSelect.value}`)
            .then(response => response.text())
            .then(html => {
                jobConfig.innerHTML = html;
            })
            .catch(error => {
                console.error('Error loading template:', error);
                jobConfig.innerHTML = '<div class="bg-red-50 border border-red-200 rounded-lg p-4"><p class="text-red-600">Error loading configuration template</p></div>';
            });
    } else {
        jobConfig.innerHTML = '<div class="bg-gray-50 rounded-lg p-6 text-center"><p class="text-gray-500">Select a job type to configure</p></div>';
    }
}

// Load template if job type is pre-selected
document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('job_type').value) {
        loadJobTypeTemplate();
    }
});
</script>
{% endblock %}
