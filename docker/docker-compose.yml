services:

  # ---------------------------------------------------------------------------
  # Muninn application
  # ---------------------------------------------------------------------------
  muninn:
    build:
      context: ..                      # repo root — COPY . . gets all app code
      dockerfile: ./docker/Dockerfile
    ports:
      - "${MUNINN_PORT:-5000}:5000"
    environment:
      FLASK_ENV:    ${FLASK_ENV:-development}
      FLASK_DEBUG:  ${FLASK_DEBUG:-true}
      FLASK_HOST:   "0.0.0.0"
      FLASK_PORT:   "5000"
      SECRET_KEY:   ${SECRET_KEY:-dev-secret-key-change-in-production}
      LOG_LEVEL:    ${LOG_LEVEL:-INFO}
      DATABASE_URL: >-
        postgresql://muninn_user:${POSTGRES_PASSWORD:-muninn_pass}@postgres:5432/muninn_dev
    env_file:
      - path: ../.env
        required: false                # optional; create from .env.example for overrides
    volumes:
      # Bind-mount for live reloading in development.
      # Remove when deploying from a pre-built image in production.
      - ..:/app
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       muninn_dev
      POSTGRES_USER:     muninn_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muninn_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muninn_user -d muninn_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
